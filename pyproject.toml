[project]
name = "platefno"
version = "0.1.0"
description = "Physical modelling of stiff membrane vibration using neural networks with spectral convolution layers"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=2",  # numpy.trapezoid
    "scipy>=1.8",  # scipy.sparse.bsr_array
    "matplotlib",
    "pandas",
    "pyarrow",
    "hydra-core",
    "hydra-joblib-launcher",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
