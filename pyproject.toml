[project]
name = "platefno"
version = "0.1.0"
description = "Physical modelling of stiff membrane vibration using neural networks with spectral convolution layers"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=2",  # numpy.trapezoid
    "scipy>=1.8",  # scipy.sparse.bsr_array
    "matplotlib",
    "pandas",
    "pyarrow",
    "hydra-core",
    "hydra-joblib-launcher",
]

# PyTorch backend, selected at sync time: uv sync --extra cpu | uv sync --extra cu126
[project.optional-dependencies]
cpu = ["torch>=2.2"]
cu126 = ["torch>=2.2"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
