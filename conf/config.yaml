defaults:
  - nnarch: basic
  - solver: linearplate
  - override hydra/launcher: joblib
  - _self_

hydra:
  run:
    dir: output/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: True

domain:
  nx: 40 # assume lx=1.0
  aspect_ratio: 0.95 # ny/nx
  sampling_rate: 48000

# Dataset: one raw .npy array (trajectories, time steps, x, y, channels) made by
# generate_dataset.py. Training standardises it as (data - mean) / std per channel;
# mean null means 0 (scale only), std null means the std of the training split.
# data.name labels the dataset in output paths and result tables.
# data.seed sets the dataset's random initial conditions and the order of the
# training batches; train.random_seed only sets the models' initial weights.
data:
  name: gamma_${solver.gamma}-kappa_${solver.kappa}-damping_${solver.damping.name}
  seed: 0
  path: output/datasets/${data.name}/ic_${train.ic}-n_${train.num_variations}-steps_${train.num_steps_train}-seed_${data.seed}.npy
  mean: null
  std: null

train:
  device: cuda
  # Models trained by this run, each with its own optimiser and scheduler
  models: [gru, rnn, ref]
  # true: clip the concatenated gradients of all the models of the run (as in the
  # paper); false: clip each model's gradients on its own
  clip_jointly: false
  epochs: 5000
  batch_size: 400
  random_seed: 0
  num_variations: 1024
  num_steps_train: 40
  val_split: 0.1
  ic: pluck
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: OneCycleLR
    max_lr: 0.001