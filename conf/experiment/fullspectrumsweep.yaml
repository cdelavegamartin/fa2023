# @package _global_
# Original vs full-spectrum FourierConv2d (phd-thesis#85) and joint vs separate
# gradient clipping. The dataset comes from the solver overrides of each run (see
# slurm/fullsweep_runs.txt); train.random_seed only sets the initial weights, so all
# seeds of a dataset use the same data.path. Runs with separate clipping MAY train
# one model per job ('train.models=[gru]' etc.); those jobs share the run directory.
hydra:
  sweep:
    dir: ${paths.output}/fullspectrumsweep/${data.name}/ic_${train.ic}/full_spectrum_${nnarch.full_spectrum}-clip_jointly_${train.clip_jointly}
    subdir: seed_${train.random_seed}
  sweeper:
    params:
      train.epochs: 5000
      train.batch_size: 400
      train.num_variations: 1024
      train.num_steps_train: 40
      train.random_seed: 0, 1, 2, 3, 4, 5
      nnarch.full_spectrum: false, true
      train.clip_jointly: true, false

  launcher:
    n_jobs: 1
